<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!-- Background -->
  <rect width="400" height="500" fill="#e8dcc8"/>
  
  <!-- Sky -->
  <ellipse cx="200" cy="100" rx="150" ry="80" fill="#d4c9b0" opacity="0.3"/>
  
  <!-- Ground -->
  <path d="M 0 350 Q 100 340 200 350 T 400 350 L 400 500 L 0 500" fill="#c9b89d" opacity="0.4"/>
  
  <!-- Left broken pillar -->
  <g>
    <rect x="40" y="200" width="35" height="200" fill="none" stroke="#333" stroke-width="2"/>
    <!-- Top broken angle -->
    <line x1="40" y1="200" x2="60" y2="160" stroke="#333" stroke-width="2"/>
    <line x1="75" y1="200" x2="95" y2="160" stroke="#333" stroke-width="2"/>
    <!-- Blade marks -->
    <line x1="50" y1="250" x2="70" y2="240" stroke="#333" stroke-width="1.5"/>
    <line x1="48" y1="300" x2="72" y2="315" stroke="#333" stroke-width="1.5"/>
    <line x1="52" y1="350" x2="68" y2="340" stroke="#333" stroke-width="1.5"/>
  </g>
  
  <!-- Center pillar -->
  <g>
    <rect x="180" y="180" width="40" height="230" fill="none" stroke="#333" stroke-width="2.5"/>
    <!-- Top broken -->
    <line x1="180" y1="180" x2="160" y2="140" stroke="#333" stroke-width="2"/>
    <line x1="220" y1="180" x2="240" y2="130" stroke="#333" stroke-width="2"/>
    <!-- Scorch marks from burning -->
    <circle cx="195" cy="220" r="3" fill="#666" opacity="0.6"/>
    <circle cx="200" cy="280" r="2" fill="#666" opacity="0.5"/>
    <circle cx="188" cy="350" r="2.5" fill="#666" opacity="0.6"/>
    <!-- Blade marks -->
    <line x1="190" y1="240" x2="210" y2="235" stroke="#333" stroke-width="1.5"/>
    <line x1="192" y1="310" x2="212" y2="320" stroke="#333" stroke-width="1.5"/>
  </g>
  
  <!-- Right broken pillar -->
  <g>
    <rect x="305" y="210" width="35" height="190" fill="none" stroke="#333" stroke-width="2"/>
    <!-- Top broken -->
    <line x1="305" y1="210" x2="285" y2="170" stroke="#333" stroke-width="2"/>
    <line x1="340" y1="210" x2="360" y2="165" stroke="#333" stroke-width="2"/>
    <!-- Blade marks -->
    <line x1="315" y1="260" x2="335" y2="270" stroke="#333" stroke-width="1.5"/>
    <line x1="318" y1="330" x2="338" y2="320" stroke="#333" stroke-width="1.5"/>
  </g>
  
  <!-- Stone blocks/ruins on ground -->
  <g>
    <rect x="20" y="380" width="60" height="40" fill="none" stroke="#333" stroke-width="2" transform="rotate(-15 50 400)"/>
    <rect x="280" y="390" width="50" height="35" fill="none" stroke="#333" stroke-width="2" transform="rotate(20 305 410)"/>
    <polygon points="120,400 140,385 160,400 155,415 125,420" fill="none" stroke="#333" stroke-width="2"/>
  </g>
  
  <!-- Tomb structure in far background -->
  <g opacity="0.7">
    <!-- Tomb building/structure -->
    <line x1="150" y1="280" x2="250" y2="280" stroke="#333" stroke-width="2"/>
    <line x1="150" y1="280" x2="155" y2="320" stroke="#333" stroke-width="2"/>
    <line x1="245" y1="280" x2="250" y2="320" stroke="#333" stroke-width="2"/>
    <!-- Door -->
    <rect x="190" y="295" width="20" height="25" fill="none" stroke="#333" stroke-width="1.5"/>
    <!-- Crack in door -->
    <path d="M 200 295 Q 205 305 200 320" fill="none" stroke="#333" stroke-width="1"/>
  </g>
  
  <!-- Something sticking out of earth (artifact/weapon) -->
  <g>
    <!-- Shaft -->
    <line x1="300" y1="420" x2="305" y2="360" stroke="#333" stroke-width="2"/>
    <!-- Arrowhead -->
    <polygon points="305,360 300,370 310,370" fill="#333"/>
  </g>
  
  <!-- Scattered debris/marks -->
  <line x1="100" y1="420" x2="110" y2="410" stroke="#333" stroke-width="1" opacity="0.6"/>
  <line x1="250" y1="430" x2="265" y2="420" stroke="#333" stroke-width="1" opacity="0.6"/>
  <circle cx="80" cy="440" r="2" fill="#333" opacity="0.5"/>
  <circle cx="320" cy="450" r="1.5" fill="#333" opacity="0.5"/>
  
  <!-- Atmosphere: subtle shadows -->
  <ellipse cx="100" cy="350" rx="50" ry="30" fill="#000" opacity="0.05"/>
  <ellipse cx="300" cy="370" rx="60" ry="35" fill="#000" opacity="0.05"/>
</svg>